<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>New Tab</title>
    <style>
      :root {
        --paper-fallback: #F6FAF8;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --paper-fallback: #0E1A1F;
        }
      }
      html, body, #root {
        background-color: var(--paper, var(--paper-fallback));
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
    </style>
    <link rel="preload" href="/fonts/Excalifont-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/Virgil.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="icon" type="image/png" sizes="16x16" href="/icon/16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icon/32.png" />
  </head>
  <body>
    <span style="font-family: 'Excalifont', 'Virgil'; position: absolute; left: -9999px; opacity: 0; pointer-events: none;" aria-hidden="true">preload</span>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
