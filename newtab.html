<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>New Tab</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <canvas id="wallpaper"></canvas>

    <button id="toggleBtn" title="Toggle drawing mode">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        class="lucide lucide-pencil-line-icon lucide-pencil-line">
        <path d="M13 21h8" />
        <path d="m15 5 4 4" />
        <path
          d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z" />
      </svg>
    </button>

    <div id="toolbar" class="hidden">
      <label
        >Color
        <input type="color" id="colorPicker" value="#f2f2f7" />
      </label>
      <label
        >Size
        <input type="range" id="sizePicker" min="1" max="40" value="4" />
      </label>
      <label
        >Background
        <input type="color" id="bgPicker" value="#14141a" />
      </label>
      <button class="toolbtn" id="eraserBtn">Eraser</button>
      <button class="toolbtn" id="undoBtn">Undo</button>
      <button class="toolbtn" id="clearBtn">Clear</button>
      <button class="toolbtn" id="doneBtn">Done</button>
    </div>

    <script src="newtab.js"></script>
  </body>
</html>
